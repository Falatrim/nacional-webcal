name: Notificador Nacional GPC

on:
  schedule:
    # 13:00 UTC = 10:00 am de Uruguay (UTC-3)
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite probarlo manualmente con un botón

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      -  by name: Instalar dependencias
        run: npm install

      - name: Ejecutar verificación
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
