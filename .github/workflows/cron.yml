name: Notificación de Partido

on:
  schedule:
    # 12:14 UTC = 09:14 AM de Uruguay (UTC-3)
    # Usar el minuto 14 esquiva la cola del minuto 0
    - cron: '14 12 * * *'
  workflow_dispatch:

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias y ejecutable de Chrome
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
